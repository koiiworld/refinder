# Render 블루프린트: AI 콘텐츠 오피스 상시 배포
# Render 대시보드 > New > Blueprint > 이 저장소 선택 시 자동 인식됩니다.
# sync: false 항목은 배포 생성 화면에서 값을 직접 입력합니다 (저장소에는 저장되지 않음).
services:
  - type: web
    name: ai-content-office
    runtime: node
    plan: free
    branch: feature/ai-content-office
    rootDir: content-office
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # 비밀번호 없이 공개되는 것을 막음 (APP_PASSWORD 미설정 시 앱 차단)
      - key: REQUIRE_PASSWORD
        value: "1"
# 키(APP_PASSWORD, DATABASE_URL, AI·네이버·유튜브·Higgsfield 키)는 저장소에 넣지 않습니다.
# 배포 후 Render > 서비스 > Environment > "Add from .env" 에 한 번에 붙여 넣으세요.
# 필요한 이름: APP_PASSWORD, DATABASE_URL(Supabase Session pooler), OPENAI_API_KEY, ANTHROPIC_API_KEY, GOOGLE_AI_API_KEY,
#   NAVER_CLIENT_ID, NAVER_CLIENT_SECRET, NAVER_AD_API_KEY, NAVER_AD_SECRET_KEY, NAVER_AD_CUSTOMER_ID, YOUTUBE_API_KEY, HIGGSFIELD_API_KEY
