<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>반품마켓 전체 스크랩</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --fg: #1c1d21; --muted: #6b6f78;
    --line: #e4e4e0; --accent: #1f5fd6; --accent-soft: #e8efff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121315; --card: #1b1d21; --fg: #eeeff1; --muted: #9b9fa8;
      --line: #2a2d33; --accent: #7aa7ff; --accent-soft: #1d2a44; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121315; --card: #1b1d21; --fg: #eeeff1; --muted: #9b9fa8;
    --line: #2a2d33; --accent: #7aa7ff; --accent-soft: #1d2a44; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { color: var(--muted); margin: 0 0 14px; font-size: 13px; }
  .search {
    width: 100%; padding: 12px 14px; font-size: 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  .search:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
  select, .chip {
    padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--fg); font-size: 13px; cursor: pointer;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .count { color: var(--muted); font-size: 13px; margin: 6px 0 10px; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
  }
  .name { margin: 0; font-size: 14px; font-weight: 600; word-break: keep-all; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
  .price { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .grade { font-size: 12px; color: var(--muted); }
  .go {
    margin-top: auto; text-align: center; text-decoration: none; padding: 8px;
    border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600;
  }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  footer { color: var(--muted); font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>반품마켓 전체 스크랩</h1>
  <p class="sub">반품마켓 카테고리 탭에서 모은 상품 목록입니다. 1차 검색용이며, 파트너스 링크는 없습니다. 가격과 재고는 수시로 바뀝니다.</p>

  <input id="q" class="search" type="search" placeholder="상품명 검색 (예: 아이패드, 에어팟, 충전기)">

  <div class="bar">
    <button class="chip on" data-g="">전체 상태</button>
    <button class="chip" data-g="반품">반품</button>
    <button class="chip" data-g="중고">중고</button>
    <button class="chip" data-g="박스 훼손">박스 훼손</button>
    <button class="chip" data-g="새 상품">새 상품</button>
    <select id="sort">
      <option value="low">가격 낮은순</option>
      <option value="high">가격 높은순</option>
      <option value="name">이름순</option>
    </select>
  </div>

  <div class="count" id="count"></div>
  <div class="list" id="list"></div>

  <footer>이 사이트는 쿠팡(주)과 무관한 독립 목록입니다. 상품 주소는 쿠팡 반품 상품 페이지로 바로 연결됩니다.</footer>
</div>

const ITEMS = RAW.trim().split('\n').map(line => {
  const [vid, pid, iid, price, name, grade] = line.split('|');
  return { vid, pid, iid, price: Number(price), name: (name || '').trim(), grade: (grade || '').trim() };
});

const link = it => `https://www.coupang.com/vp/products/${it.pid}?itemId=${it.iid}&vendorItemId=${it.vid}&landingType=USED_DETAIL&sourceType=OFFER_LIST`;
const won = n => n.toLocaleString('ko-KR') + '원';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const state = { q: '', g: '', sort: 'low' };

function render() {
  const q = state.q.trim().toLowerCase();
  let items = ITEMS.filter(it =>
    (!state.g || it.grade.includes(state.g)) &&
    (!q || (it.name + ' ' + it.grade + ' ' + it.name.replace(/mini/gi, '미니')).toLowerCase().includes(q))
  );
  const sorters = {
    low: (a, b) => (a.price || 1e15) - (b.price || 1e15),
    high: (a, b) => (b.price || 0) - (a.price || 0),
    name: (a, b) => a.name.localeCompare(b.name, 'ko'),
  };
  items.sort(sorters[state.sort]);
  document.getElementById('count').textContent = `${items.length}개 / 전체 ${ITEMS.length}개`;
  document.getElementById('list').innerHTML = items.length ? items.map(it => `
    <div class="item">
      <p class="name">${esc(it.name)}</p>
      <div class="meta"><span class="price">${it.price ? won(it.price) : '가격 확인 필요'}</span></div>
      <div class="grade">${esc(it.grade || '상태 정보 없음')}</div>
      <a class="go" href="${link(it)}" target="_blank" rel="noopener noreferrer">쿠팡에서 보기</a>
    </div>`).join('') : '<div class="empty">조건에 맞는 상품이 없습니다.</div>';
}

document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });
document.getElementById('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
  state.g = b.dataset.g;
  document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
  render();
}));
render();
</script>
