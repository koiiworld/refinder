<!doctype html><html lang="ko"><meta charset="utf-8"><title>콘텐츠 오피스 · 서이추 실행창</title><style>body{font:16px system-ui;max-width:860px;margin:40px auto;padding:20px;line-height:1.7}button,input{font:inherit;padding:10px;margin:6px}button{cursor:pointer}pre{white-space:pre-wrap;background:#f4f5f8;padding:16px}#state{font-weight:bold}</style><h1>서이추 실행창</h1><p>AI Content Office에서 요청한 작업을 현재 크롬으로 실행해요. 네이버에 평소 쓰는 계정으로 로그인해 두세요. 이 탭을 켜 두어야 연속 작업이 진행됩니다.</p><p>로그인·계정보호·확인되지 않은 결과가 나오면 자동 중지해요. 로그인 쿠키와 비밀번호는 웹앱으로 보내지 않아요.</p><label>오늘 다른 프로그램·직접 신청으로 보낸 수 <input id="baseline" type="number" min="0" max="100" value="0"></label><p>처음 사용할 때 오늘 이미 보낸 수를 입력하세요. 이 확장 프로그램에서 보낸 기록은 별도로 자동 계산해요.</p><button id="start">웹앱의 대기 작업 확인·실행</button><button id="stop">중지</button><button id="naver">네이버 로그인 화면 열기</button><p id="state" role="status">실행 대기</p><pre id="log"></pre><script type="module" src="seoichoo.js"></script></html>
